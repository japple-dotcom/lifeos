# Builds the Life OS app for Mac, Windows, Linux and the Raspberry Pi, checks each one starts, and publishes them
# with the update file and the update feed (latest.json) as a GitHub release.
#
# To release: bump __version__ in lifeos/__init__.py, add a section to CHANGES.md and push to main, then either
#   - on GitHub: Actions > Release > Run workflow (the release is named after __version__, e.g. v0.17.0), or
#   - push a tag: git tag v0.17.1 && git push origin v0.17.1
# Installed copies find it through https://github.com/<you>/lifeos/releases/latest/download/latest.json
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]   # every push to main tests and builds all five apps (nothing is published)
  workflow_dispatch:   # Actions > Release > Run workflow: tests, builds and publishes v<__version__>

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q tests/test_lifeos.py tests/test_app_packaging.py tests/test_v019_features.py tests/test_v020_features.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, key: linux-x86_64, out: lifeos-linux-x86_64 }
          - { os: ubuntu-22.04-arm, key: linux-arm64, out: lifeos-linux-arm64 }
          - { os: macos-15, key: mac-arm64, out: LifeOS-mac-arm64.dmg }   # Apple chips (M1 and later)
          - { os: macos-15-intel, key: mac-x64, out: LifeOS-mac-intel.dmg }
          - { os: windows-latest, key: windows-x64, out: LifeOS-windows.exe }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.key, 'mac-') }}   # GitHub's Mac machines are sometimes too busy; release the rest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Point the app at this repository's update feed
        run: |
          echo "{\"feed\": \"https://github.com/${{ github.repository }}/releases/latest/download/latest.json\"}" > lifeos/release.json
      # Ready-made packages only: on an Intel Mac a newer cryptography has none, and building it here links a second
      # OpenSSL that clashes with Python's inside the app (notifications and backups then fail to load). pip picks
      # the newest version that has a ready-made package for each machine instead.
      - run: pip install --only-binary=cryptography -r requirements.txt -r requirements-app.txt
      - run: pyinstaller packaging/lifeos.spec --noconfirm
      - name: Sign the Mac app for this computer (ad hoc)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - "dist/Life OS.app"
      - name: Check it starts and shows the setup page
        env:
          LIFEOS_NO_TRAY: "1"
        run: |
          case "${{ runner.os }}" in
            macOS) APP="dist/Life OS.app/Contents/MacOS/Life OS" ;;
            Windows) APP="dist/LifeOS.exe" ;;
            *) APP="dist/lifeos" ;;
          esac
          "$APP" --version
          "$APP" --headless --home "$RUNNER_TEMP/lifeos-home" --port 8840 > "$RUNNER_TEMP/run.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8840/health | grep -q '"setup":true'; then echo "started"; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8840/health | grep -q '"setup":true' || { cat "$RUNNER_TEMP/run.log"; exit 1; }
          curl -fsS -o "$RUNNER_TEMP/setup.html" http://127.0.0.1:8840/setup && grep -q "Welcome to Life OS" "$RUNNER_TEMP/setup.html"
          kill %1 || true
      - name: Check it opens the main app for a household that's already set up
        env:
          LIFEOS_NO_TRAY: "1"
        run: |
          case "${{ runner.os }}" in
            macOS) APP="dist/Life OS.app/Contents/MacOS/Life OS" ;;
            Windows) APP="dist/LifeOS.exe" ;;
            *) APP="dist/lifeos" ;;
          esac
          H="$RUNNER_TEMP/lifeos-home-setup"
          mkdir -p "$H"
          printf 'LIFEOS_API_KEY=ci-household-key-123\nLIFEOS_SIGNING_SECRET=ci-signing-secret-0123456789abcdef\n' > "$H/.env"
          "$APP" --headless --home "$H" --port 8841 > "$RUNNER_TEMP/run2.log" 2>&1 &
          PID=$!
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:8841/health > /dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8841/health || { echo "::error::the app didn't start"; cat "$RUNNER_TEMP/run2.log"; exit 1; }
          echo
          ok=1
          # (download to a file first: grep -q stops reading early, and pipefail then counts curl's write as a failure)
          curl -fsS -o "$RUNNER_TEMP/app.html" http://127.0.0.1:8841/app/ && grep -qi "<!doctype html" "$RUNNER_TEMP/app.html" || ok=0
          curl -fsS -o /dev/null http://127.0.0.1:8841/app/app.js || ok=0
          curl -fsS -o /dev/null http://127.0.0.1:8841/app/wall.html || ok=0
          # Phone notifications must start inside the app (their packages are only imported when needed)
          curl -fsS -c "$RUNNER_TEMP/cj" -H 'Content-Type: application/json' \
            -d '{"key":"ci-household-key-123","person":"me"}' http://127.0.0.1:8841/api/login > /dev/null || ok=0
          if curl -fsS -b "$RUNNER_TEMP/cj" -o "$RUNNER_TEMP/push.json" http://127.0.0.1:8841/api/push/key && grep -q '"key"' "$RUNNER_TEMP/push.json"; then
            echo "notifications ready"
          else
            echo "::error::notifications didn't start"; curl -sS -b "$RUNNER_TEMP/cj" http://127.0.0.1:8841/api/push/key; ok=0
          fi
          kill $PID || true
          if [ "$ok" = 1 ]; then echo "main app served"; else echo "::error::main app page missing"; cat "$RUNNER_TEMP/run2.log"; exit 1; fi
      - name: Package
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            macOS)
              mkdir dmg && cp -R "dist/Life OS.app" dmg/ && ln -s /Applications dmg/Applications
              hdiutil create -volname "Life OS" -srcfolder dmg -ov -format UDZO "out/${{ matrix.out }}" ;;
            Windows) cp dist/LifeOS.exe "out/${{ matrix.out }}" ;;
            *) cp dist/lifeos "out/${{ matrix.out }}" && chmod +x "out/${{ matrix.out }}" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: out/${{ matrix.out }}

  release:
    needs: [test, build]
    # always(): a Mac build GitHub never found a machine for counts as "cancelled", which would skip the release.
    # The check below still insists on Windows, both Linux builds and at least one Mac app.
    if: >-
      always() && needs.test.result == 'success'
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Work out the release name (the tag, or v + the version in the code)
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else
            TAG="v$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("lifeos/__init__.py").read()).group(1))')"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG"
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Check the essential apps were built
        run: |
          ls -la apps
          for f in LifeOS-windows.exe lifeos-linux-x86_64 lifeos-linux-arm64 LifeOS-mac-intel.dmg; do
            [ -f "apps/$f" ] || { echo "::error::$f wasn't built"; exit 1; }
          done
          [ -f apps/LifeOS-mac-arm64.dmg ] || echo "::warning::No Apple-chip Mac build this time (GitHub had no machine free); the Intel one runs on Apple-chip Macs through Rosetta."
      - name: Update file and feed
        run: |
          echo "{\"feed\": \"https://github.com/${{ github.repository }}/releases/latest/download/latest.json\"}" > lifeos/release.json
          KEYS=$(python - <<'PY'
          import os, sys
          sys.path.insert(0, "packaging")
          from make_update import APP_FILES
          print(",".join(k for k, f in APP_FILES.items() if os.path.exists(os.path.join("apps", f))))
          PY
          )
          python packaging/make_update.py --out apps --feed "https://github.com/${{ github.repository }}/releases/download/$TAG" --apps "$KEYS"
          python packaging/make_update.py --out apps > /dev/null
          ls -la apps
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > notes.md
          import json
          print(json.load(open("apps/latest.json"))["notes"] or "See CHANGES.md")
          PY
          gh release create "$TAG" apps/* --target "${{ github.sha }}" --title "Life OS $TAG" --notes-file notes.md
