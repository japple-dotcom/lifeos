[project]
name = "lifeos"
description = "Household assistant: phone app + AI agent over Google Tasks/Calendar/Gmail and Home Assistant"
requires-python = ">=3.10"
dynamic = ["version"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501", "UP007", "UP045", "SIM105", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
