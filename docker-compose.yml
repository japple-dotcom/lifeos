services:
  lifeos:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8800:8800"   # keep this on your home network; reach it remotely through Tailscale or a VPN
    volumes:
      - ./config:/app/config
      - ./secrets:/app/secrets
      - ./data:/app/data

